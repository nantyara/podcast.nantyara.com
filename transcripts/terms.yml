# scripts/eleven_transcribe.rb が読む文字起こし用の辞書
# keyterms: ElevenLabs に渡して聞き取りを寄せる語（増やすほどクレジットが上乗せされるので絞る）
# replace:  書き起こし後に機械的に置換する表記ゆれ（日常会話に出る語は誤爆するので入れない）
keyterms:
  - なんちゃらアイドル
  - なんちゃラジオ
  - 御茶海マミ
  - あおはる
  - Ｑ太郎
replace:
  - from: なんちゃらジオ
    to: なんちゃラジオ
  - from: 御茶水マミ
    to: 御茶海マミ
  - from: 美波マミ
    to: 御茶海マミ
  - from: 水女マミ
    to: 御茶海マミ
